function pickOpt(o){const r=o.f();if(G.hp<=0)return die();if(typeof r=='string')show(V.t,r,[{l:'Далі',f:finishRoom}])}
function die(){scene='over';if(C)C.busy=1}
function enter(i){const r=G.rooms[i];G.cur=i;
if(r.t=='fight'||r.t=='boss')fight(r.t=='boss');
else if(r.t=='trap'){const t=pick(TRAPS);show(t.t,t.x,t.o)}
else if(r.t=='event'){const t=pick(EVTS);show(t.t,t.x,t.o)}
else{const q=Math.random();let m;if(q<.4){const g=25+rnd(21);G.gold+=g;m='У скрині '+g+' золота.'}else if(q<.7)m='У скрині картка: '+CD[gain()].n+'.';else if(q<.9&&relLeft().length){const r=pick(relLeft());takeRel(r);m='Артефакт «'+RL[r].n+'». Плюс: '+RL[r].t+'. Мінус: '+RL[r].q+'.'}else m=heal(10)+' У скрині було цілюще зілля.';show('Скриня',m,[{l:'Далі',f:finishRoom}])}}
function finishRoom(){G.rooms[G.cur].done=1;if(!G.rooms.every(r=>r.done)){scene='floor';return}
if(G.fl==10){scene='win';return}
G.rw=[pick([{l:'Тренування: +2 урону всіх атак',f:()=>G.db+=2},{l:'Тренування: +2 блоку всіх карт',f:()=>G.bb+=2}]),{l:'Відпочинок: відновити 25 HP',f:()=>heal(25)},{l:'Скарб: +45 золота',f:()=>G.gold+=45}];scene='reward'}
function genShop(){G.shop={cards:shuf([...(G.cls=='mage'?MPOOL:POOL)]).slice(0,3).map(id=>({id,p:30+rnd(4)*10,sold:0})),rel:shuf(relLeft()).slice(0,2).map(id=>({id,p:RL[id].p,sold:0})),pot:0}}
// ---------- бій ----------
function draw(n){for(let i=0;i<n;i++){if(!C.dr.length){C.dr=shuf(C.di);C.di=[]}if(C.dr.length)C.h.push(C.dr.pop())}}
function startTurn(){C.bl=0;C.en=Math.max(1,3+rs('en')-(C.fr?1:0));if(C.fr)fl(90,100,'Холод: -1 енергії','#80d8ff');C.fr=0;if(C.po>0){G.hp-=C.po;fl(90,120,'Отрута -'+C.po,'#80e040');C.po--}if(rs('hd')){G.hp-=rs('hd');fl(90,140,'Книга -'+rs('hd'),'#c080ff')}draw(Math.max(2,5+rs('hand')))}
// ---------- бій з 1-3 ворогами ----------
const EX=(i,n)=>n<2?530:n==2?[440,610][i]:[380,520,660][i];
function fight(b){const f=G.fl,n=b?1:f==1?1:1+(Math.random()<.25+.05*f?1:0)+(f>=5&&Math.random()<.08*f-.2?1:0);
const pool=ENV.filter(e=>e.f<=f),gh=[1,1,.8,.65][n],gd=[1,1,.75,.6][n],hm=(b?1.2:1.2+.15*(f-1))*(1+rs('eh'))*gh,dm=(b?1.15:1.15+.1*(f-1))*(1+rs('em'))*gd;
const es=Array.from({length:n},()=>{const e=b?BOSS:pick(pool),hp=Math.max(6,Math.round(e.hp*hm));return{...e,hp,mx:hp,bl:0,i:b?0:rnd(2),m:dm}});
C={es,t:0,n0:n,nm:es[0].n,dr:shuf([...G.deck]),h:[],di:[],en:3,bl:0,busy:0,po:0,fr:0,boss:b};startTurn();C.bl+=rs('sb');scene='fight';if(G.hp<=0)die()}
function intent(e){const[k,v,n=1,nm]=e.a[e.i%e.a.length],d=Math.round(v*e.m),x=n>1?'x'+n:'';return[nm,{a:'Атака '+d+x,m:'Магія '+d+x+' (крізь блок)',f:'Мороз '+d+', -1 енергії',v:'Висмоктує '+d+x,p:'Отрута +'+v,d:'Захист '+v,w:'Павутина: -1 енергії',h:'Лікується +'+v}[k]]}
function play(i){if(C.busy)return;const id=C.h[i],c=CD[id];if(c.c>C.en)return;C.en-=c.c;
const tg=c.all?[...C.es]:[C.es[C.t]||C.es[0]];
tg.forEach(e=>{const x=EX(C.es.indexOf(e),C.es.length);
if(c.d){let t=0;for(let k=0;k<(c.x||1);k++){const d=DM(c),ab=Math.min(e.bl,d);e.bl-=ab;e.hp-=d-ab;t+=d}fl(x,150,'-'+t,'#ff6060')}
if(c.bk){e.bk=(e.bk||0)+c.bk;fl(x,112,'Кровотеча +'+c.bk,'#d03050')}
if(c.bu){const u=c.bu+rs('bn');e.bu=(e.bu||0)+u;fl(x,130,'Підпал +'+u,'#ff9040')}});
if(c.b){const b=Math.max(0,c.b+BB());C.bl+=b;fl(90,150,'+'+b+' блок','#70a8ff')}
if(c.hl){const a=Math.min(c.hl+rs('hb'),G.mx-G.hp);G.hp+=a;fl(90,130,'+'+a+' HP','#70e070')}
if(c.sd){G.hp-=c.sd;fl(90,130,'-'+c.sd,'#ff6060')}
if(c.en)C.en+=c.en;C.h.splice(i,1);C.di.push(id);if(c.dr)draw(c.dr);
if(G.hp<=0)return die();
C.es=C.es.filter(e=>e.hp>0);if(C.t>=C.es.length)C.t=0;if(!C.es.length)winFight()}
function winFight(){if(C.busy===2)return;C.busy=2;const g=C.boss?0:Math.max(0,Math.round((12+rnd(14)+G.fl*2)*(1+.35*(C.n0-1)))+rs('gb')),hh=Math.min(rs('hc'),G.mx-G.hp);G.gold+=g;G.hp+=hh;const k=C;
setTimeout(()=>{if(C===k)show('Перемога!',(C.n0>1?'Ворогів переможено.':C.nm+' переможений.')+(g?' +'+g+' золота.':'')+(hh?' +'+hh+' HP.':''),[{l:'Далі',f:finishRoom}])},600)}
function act(e,i){const[a,v,n=1]=e.a[e.i%e.a.length],x=EX(C.es.indexOf(e),C.es.length),y=120+i*18;
if(a=='d'){e.bl+=v;fl(x,150,'+'+v+' блок','#70a8ff')}
else if(a=='p'){C.po+=v;fl(90,y,'Отрута +'+v,'#80e040')}
else if(a=='w'){C.fr=1;fl(90,y,'Павутина!','#d0d0e0')}
else if(a=='h'){e.hp=Math.min(e.mx,e.hp+v);fl(x,150,'+'+v+' HP','#70e070')}
else{let t=0;for(let j=0;j<n;j++){const d=Math.round(v*e.m);if(a=='m')t+=d;else{const ab=Math.min(C.bl,d);C.bl-=ab;t+=d-ab}}
G.hp-=t;fl(90,y,t?'-'+t:'Блок!',t?(a=='m'?'#c080ff':a=='f'?'#80d8ff':'#ff6060'):'#70a8ff');
if(a=='f')C.fr=1;if(a=='v'){e.hp=Math.min(e.mx,e.hp+t);if(t)fl(x,150,'+'+t+' HP','#70e070')}}
e.i++}
function endTurn(){if(C.busy)return;C.busy=1;C.di.push(...C.h);C.h=[];C.es.forEach(e=>e.bl=0);const k=C;
setTimeout(()=>{if(C!==k||scene!='fight')return;
[...C.es].forEach((e,i)=>{if(G.hp<=0)return;const x=EX(C.es.indexOf(e),C.es.length);
if(e.bk>0){const t=e.bk;e.hp-=t;fl(x,112,'Кровотеча -'+t,'#d03050');e.bk=Math.max(0,e.bk-2)}
if(e.bu>0){const t=e.bu+rs('bt');e.hp-=t;fl(x,130,'Підпал -'+t,'#ff9040');e.bu=Math.max(0,e.bu-2)}
if(e.hp>0)act(e,i)});
if(G.hp<=0)return die();
C.es=C.es.filter(e=>e.hp>0);if(!C.es.length)return winFight();if(C.t>=C.es.length)C.t=0;
startTurn();if(G.hp<=0)return die();C.busy=0},700)}
function drawFoes(now){const n=C.es.length;C.es.forEach((e,i)=>{const x=EX(i,n),px=n==1?(e.px||7):n==2?6:5,w=n==1?200:n==2?150:120;
spr(e.s,x,215+Math.sin(now/300+i)*3,px);btns.push({x:x-70,y:26,w:140,h:200,f:()=>C.t=i});
if(n>1&&i==C.t){ctx.fillStyle='#ffd24a';ctx.fillRect(x-34,222,68,3)}
T(e.n,x,28,n==1?14:11,'#f0e8d8','center');ctx.fillStyle='#401818';ctx.fillRect(x-w/2,46,w,14);ctx.fillStyle='#c03030';ctx.fillRect(x-w/2,46,w*Math.max(0,e.hp)/e.mx,14);
T(Math.max(0,e.hp)+'/'+e.mx+(e.bl?' Блок '+e.bl:''),x,48,10,'#fff','center');
if(e.bu||e.bk)T((e.bu?'Підпал '+e.bu:'')+(e.bu&&e.bk?' · ':'')+(e.bk?'Кров. '+e.bk:''),x,62,10,'#ff9040','center');
const[nm,ef]=intent(e);if(nm){T(nm,x,76,11,'#ffd070','center');T(ef,x,89,11,'#ffb060','center')}else T(ef,x,82,11,'#ffb060','center')})}
// ---------- екрани ----------
function hud(){T('HP '+G.hp+'/'+G.mx,12,8,13,'#ff7070');T('Золото '+G.gold,150,8,13,'#ffd24a');T('Карт '+G.deck.length,290,8,13,'#b0b0ff');G.rel.forEach((id,i)=>{const b={x:W-30-i*24,y:6,w:20,h:20};ctx.fillStyle=RL[id].c;ctx.fillRect(b.x,b.y,20,20);T(RL[id].n[0],b.x+10,b.y+3,13,'#fff','center');if(hit(b))TIP=id})}
const LBL={fight:'Бій',trap:'Пастка',chest:'Скриня',event:'Подія',boss:'БОС'};
function icon(t,x,y){ctx.lineWidth=6;ctx.strokeStyle='#d04040';
if(t=='fight'){ctx.beginPath();ctx.moveTo(x-22,y-22);ctx.lineTo(x+22,y+22);ctx.moveTo(x+22,y-22);ctx.lineTo(x-22,y+22);ctx.stroke()}
else if(t=='trap'){ctx.fillStyle='#e0b020';ctx.beginPath();ctx.moveTo(x,y-26);ctx.lineTo(x+28,y+22);ctx.lineTo(x-28,y+22);ctx.fill();T('!',x,y-6,22,'#1a1020','center')}
else if(t=='chest'){ctx.fillStyle='#8a5a2a';ctx.fillRect(x-26,y-14,52,34);ctx.fillStyle='#ffd24a';ctx.fillRect(x-26,y-2,52,6);ctx.fillRect(x-4,y-4,8,12)}
else if(t=='event'){ctx.fillStyle='#a060d0';ctx.save();ctx.translate(x,y);ctx.rotate(.785);ctx.fillRect(-18,-18,36,36);ctx.restore();T('?',x,y-8,18,'#fff','center')}
else spr('necro',x-3,y+34,4)}
function dMenu(){T('ВЕЖА ТІНЕЙ',W/2,70,28,'#ffd24a','center',1);T('Карткова гра-підземелля',W/2,125,14,'#a898c0','center');

spr('hero',W/2,330,8);btn(W/2-100,370,200,48,'Почати забіг',()=>scene='cls')}
function dFloor(){hud();T('ПОВЕРХ '+G.fl+' / 10',W/2,32,16,'#ffd24a','center',1);T(TIERS[tier()].n,W/2,62,13,'#a898c0','center');const n=G.rooms.length,w=130,gp=30,x0=(W-n*w-(n-1)*gp)/2;
G.rooms.forEach((r,i)=>{const x=x0+i*(w+gp),y=110,lock=r.t=='boss'&&G.rooms.some(q=>q.t!='boss'&&!q.done);
btn(x,y,w,210,'',()=>enter(i),!r.done&&!lock);icon(r.t,x+w/2,y+85);T(LBL[r.t],x+w/2,y+150,16,r.done?'#666':'#f0e8d8','center');
if(r.done)T('Пройдено',x+w/2,y+180,12,'#70c070','center');else if(lock)T('Закрито',x+w/2,y+180,12,'#c07070','center')});
T('Обери кімнату',W/2,370,14,'#a898c0','center')}
function dView(){hud();panel(100,60,520,350);T(V.t,W/2,85,14,'#ffd24a','center',1);WT(V.x,130,135,460,15,'#e8e0d0');
V.o.forEach((o,i)=>btn(130,420-(V.o.length-i)*48,460,36,o.l,()=>pickOpt(o)))}
function dReward(){hud();T('Поверх пройдено!',W/2,60,16,'#ffd24a','center',1);T('Обери нагороду',W/2,110,14,'#a898c0','center');
G.rw.forEach((o,i)=>btn(130,150+i*70,460,52,o.l,()=>{o.f();genShop();scene='shop'}))}
function dShop(){hud();T('ТОРГОВЕЦЬ',W/2,50,16,'#ffd24a','center',1);spr('ghost',620,150,5);const S=G.shop;
S.cards.forEach((s,i)=>{const x=60+i*135;card(s.id,x,110,false,s.sold);const p=PR(s.p);btn(x,270,112,32,s.sold?'Продано':p+' зол.',()=>{G.gold-=p;G.deck.push(s.id);s.sold=1},!s.sold&&G.gold>=p)});
btn(470,190,200,50,S.pot?'Зілля куплено':'Зілля +25 HP (25 зол.)',()=>{G.gold-=25;heal(25);S.pot=1},!S.pot&&G.gold>=25);
btn(470,270,200,50,'Спуститись глибше',()=>{G.fl++;genFloor();scene='floor'});T('Артефакти',W/2,322,13,'#a898c0','center');S.rel.forEach((s,i)=>{const x=60+i*320,y=345,r=RL[s.id],p=PR(s.p);btn(x,y,300,100,'',()=>{G.gold-=p;takeRel(s.id);s.sold=1},!s.sold&&G.gold>=p);ctx.fillStyle=r.c;ctx.fillRect(x+8,y+8,16,16);T(r.n,x+32,y+9,13,'#f0e8d8');T('Плюс: '+r.t,x+10,y+34,11,'#70e070');T('Мінус: '+r.q,x+10,y+52,11,'#ff7070');T(s.sold?'Куплено':p+' зол.',x+290,y+76,13,'#ffd24a','right')})}
function dFight(){hud();const now=performance.now();spr(G.cls=='mage'?'mage':'hero',90,215,7);drawFoes(now);
ctx.fillStyle='#401818';ctx.fillRect(30,225,120,12);ctx.fillStyle='#c03030';ctx.fillRect(30,225,120*Math.max(0,G.hp)/G.mx,12);T(G.hp+'/'+G.mx,90,225,10,'#fff','center');
if(C.bl)T('Блок '+C.bl,90,243,13,'#70a8ff','center');T('Енергія '+C.en+'/'+(3+rs('en')),90,268,14,'#ffe066','center');if(C.po)T('Отрута '+C.po,90,288,12,'#80e040','center');
T(C.busy?'Хід ворога...':(C.es.length>1?'Ваш хід · клікни ворога, щоб обрати ціль':'Ваш хід'),W/2,262,14,'#a898c0','center');
btn(560,258,150,38,'Кінець ходу',endTurn,!C.busy);T('Добір '+C.dr.length+' · Скид '+C.di.length,635,302,11,'#a898c0','center');
const n=C.h.length,st=n>1?Math.min(120,(W-40-112)/(n-1)):0,x0=(W-(112+(n-1)*st))/2;let hv=-1;
C.h.forEach((id,i)=>{const b={x:x0+i*st,y:322,w:i==n-1?112:Math.min(112,st),h:150};if(!C.busy&&hit({x:b.x,y:308,w:b.w,h:164}))hv=i});
C.h.forEach((id,i)=>{const x=x0+i*st,c=CD[id];card(id,x,322-(i==hv?14:0),i==hv,c.c>C.en);btns.push({x,y:308,w:i==n-1?112:Math.min(112,st),h:164,f:()=>play(i)})})}
function dEnd(win){T(win?'ПЕРЕМОГА!':'ВИ ЗАГИНУЛИ',W/2,130,24,win?'#ffd24a':'#d04040','center',1);
T(win?'Некромант розсипався на порох. Золота: '+G.gold:'Ви дійшли до поверху '+G.fl+' з 10',W/2,200,15,'#e8e0d0','center');spr(G.cls=='mage'?'mage':'hero',W/2,330,6);btn(W/2-100,370,200,48,'Новий забіг',()=>scene='cls')}
function dClass(){T('ОБЕРИ СПЕЦІАЛІЗАЦІЮ',W/2,28,14,'#ffd24a','center',1);
[['hero','Лицар','Меч і щит. 60 HP. Надійні удари та блок: карти атаки й захисту.','knight'],['mage','Маг','Посох і магічний капелюх. 50 HP. Вогонь з підпалом, магічні щити, зцілення та крижані заклинання.','mage']].forEach((c,i)=>{const x=40+i*340;btn(x,70,300,340,'',()=>newRun(c[3]));spr(c[0],x+150,215,8);T(c[1],x+150,232,16,'#ffd24a','center',1);WT(c[2],x+20,275,260,13,'#d8d0c0','left')})}
const SC={cls:dClass,menu:dMenu,floor:dFloor,fight:dFight,view:dView,reward:dReward,shop:dShop,over:()=>dEnd(0),win:()=>dEnd(1)};
function loop(){btns=[];TIP=null;ctx.imageSmoothingEnabled=false;ctx.drawImage(BGS[G&&scene!='menu'&&scene!='cls'?tier():0],0,0);torch(24,150);torch(W-24,150);SC[scene]();
const now=performance.now();floats=floats.filter(f=>now-f.t<1000);floats.forEach(f=>{ctx.globalAlpha=1-(now-f.t)/1000;T(f.s,f.x,f.y-(now-f.t)/18,18,f.c,'center');ctx.globalAlpha=1});
if(TIP){const r=RL[TIP];panel(W-300,34,284,74);T(r.n,W-290,42,13,'#ffd24a');T('Плюс: '+r.t,W-290,62,11,'#70e070');T('Мінус: '+r.q,W-290,80,11,'#ff7070')}cv.style.cursor=btns.some(b=>b.f&&hit(b))?'pointer':'default';requestAnimationFrame(loop)}
function mp(e){const r=cv.getBoundingClientRect();M.x=(e.clientX-r.left)*W/r.width;M.y=(e.clientY-r.top)*H/r.height}
cv.addEventListener('mousemove',mp);
cv.addEventListener('click',e=>{mp(e);for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(b.f&&hit(b)){b.f();break}}});
loop();
</script></body></html>
